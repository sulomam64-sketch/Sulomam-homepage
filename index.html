<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="作編曲家・ギタリスト・MIXエンジニア Sulomam の音楽製作（オーダー）公式サイト"
    />
    <title>Sulomam | Guitar REC & Track Production</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Netlify Forms detection for /guitar. The live form is rendered by React
      and posted to /. Field names must match SongRequestForm.
    -->
    <form name="guitar-song-request" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="song" />
      <input type="text" name="artist" />
      <input type="text" name="handle" />
      <textarea name="message"></textarea>
      <input type="text" name="hear" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
